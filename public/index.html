const STEPS = [
  { key: 'kitchen', label: 'Kitchen', icon: 'Flame' },
  { key: 'recipes', label: 'Recipes', icon: 'ChefHat' },
  { key: 'schedule', label: 'Schedule', icon: 'CalendarClock' },
  { key: 'plan', label: 'Master Plan', icon: 'ListChecks' },
];
function defaultSettings() {
  const d = new Date(); d.setHours(17, 0, 0, 0);
  return { ovens: 1, racks: 2, burners: 4, cooks: 1, anchor: 'target', time: toLocalInput(d), strategy: 'express', buffer: 10, equipment: {} };
}

function App() {
  const [step, setStep] = useState(() => store.get('ks.step', 0));
  const [recipes, setRecipes] = useState(() => store.get('ks.recipes', []).map((r) => ({ ...normalizeRecipe(r), _review: r._review })));
  const [settings, setSettings] = useState(() => ({ ...defaultSettings(), ...store.get('ks.settings', {}) }));
  const [plan, setPlan] = useState(() => store.get('ks.plan', null));
  const [planKey, setPlanKey] = useState(() => store.get('ks.planKey', ''));
  const [checked, setChecked] = useState(() => store.get('ks.checked', {}));
  const [editing, setEditing] = useState(null);
  const [clarify, setClarify] = useState(null);
  const [dismissed, setDismissed] = useState([]);
  const [busy, setBusy] = useState(false);
  const [progress, setProgress] = useState('');
  const [toasts, setToasts] = useState([]);
  const [ai, setAi] = useState(() => store.get('ks.ai', { key: '', enabled: true }));
  const [hosted, setHosted] = useState({ enabled: false });

  useEffect(() => store.set('ks.ai', ai), [ai]);
  useEffect(() => { fetchAIStatus().then(setHosted); }, []);
  useEffect(() => store.set('ks.recipes', recipes), [recipes]);
  useEffect(() => store.set('ks.settings', settings), [settings]);
  useEffect(() => store.set('ks.checked', checked), [checked]);
  useEffect(() => store.set('ks.step', step), [step]);
  useEffect(() => { store.set('ks.plan', plan); store.set('ks.planKey', planKey); }, [plan, planKey]);

  const toast = (msg, kind = 'ok') => {
    const id = uid();
    setToasts((t) => [...t, { id, msg, kind }]);
    setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), 4500);
  };
  const currentKey = JSON.stringify({ r: recipes.map(({ _review, ...r }) => r), s: settings });
  const stale = !!plan && planKey !== currentKey;

  const build = (rs = recipes, st = settings) => {
    const clean = rs.map(({ _review, ...r }) => r);
    const p = generatePlan(clean, st);
    setPlan(p);
    setPlanKey(JSON.stringify({ r: clean, s: st }));
    setStep(3);
    const issues = p.alerts.filter((a) => a.severity !== 'info').length;
    toast(issues ? `Plan ready – ${issues} item${issues > 1 ? 's' : ''} worth a look` : 'Plan ready – no conflicts!');
  };

  const requestBuild = () => {
    if (!recipes.length) { toast('Add at least one recipe first', 'error'); setStep(1); return; }
    const qs = [...validate(recipes, settings, dismissed), ...reviewQuestions(recipes)];
    if (qs.length) setClarify({ mode: 'build', questions: qs });
    else build();
  };

  const applyAnswers = (vals) => {
    let rs = recipes.map((r) => ({ ...r }));
    let st = { ...settings };
    const newlyDismissed = [];
    for (const q of clarify.questions) {
      const v = vals[q.key];
      if (q.dismissKey) newlyDismissed.push(q.dismissKey);
      if (q.input === 'choice') {
        if (v === 'compromise') rs = applyCompromise(rs, q.conflict.ids, q.conflict.temp);
        if (v === 'addOven') st.ovens = Math.min(4, st.ovens + 1);
        continue;
      }
      const val = q.input === 'number' ? int0(v) : v;
      if (q.recipeId) rs = rs.map((r) => (r.id === q.recipeId ? { ...r, [q.field]: val, ...(q.field === 'ovenTemp' && val > 0 && r.passiveWhere !== 'oven' && r.passiveTime > 0 ? { passiveWhere: 'oven' } : {}) } : r));
      else st[q.field] = val;
    }
    const reviewed = new Set(clarify.questions.filter((q) => q.severity === 'review').map((q) => q.recipeId));
    rs = rs.map((r) => (reviewed.has(r.id) ? (({ _review, ...x }) => x)(r) : r));
    const dis = [...dismissed, ...newlyDismissed];
    setRecipes(rs); setSettings(st); setDismissed(dis);
    const mode = clarify.mode;
    setClarify(null);
    if (mode === 'build') {
      const remaining = validate(rs, st, dis).filter((q) => q.severity === 'error');
      if (remaining.length) setClarify({ mode: 'build', questions: remaining });
      else build(rs, st);
    } else toast('Thanks – recipes updated');
  };

  const onImport = async (files, pasted) => {
    setBusy(true);
    const added = [], failed = [], aiProblems = [];
    let useAI = ai.enabled && (!!ai.key || (hosted.enabled && hosted.remaining > 0)), aiCount = 0;
    // Try Claude first; fall back to the basic reader if AI is off or the request fails.
    const read = async (label, viaAI, viaBasic) => {
      if (useAI) {
        try {
          setProgress(`Claude is reading ${label}…`);
          const { recipes: rs, remaining } = await viaAI();
          if (remaining != null) setHosted((h) => ({ ...h, remaining }));
          aiCount += rs.length;
          return rs;
        } catch (e) {
          console.error(e);
          aiProblems.push(e.message);
          if (e.remaining != null) setHosted((h) => ({ ...h, remaining: e.remaining }));
          if (e.fatal) useAI = false;
        }
      }
      return viaBasic();
    };
    try {
      if (pasted) added.push(...await read('your pasted text', () => aiReadText(pasted, ai.key), async () => splitAndParse(pasted, 'Pasted recipe')));
      for (const f of files || []) {
        try {
          const rs = await read(f.name, () => aiReadFile(f, ai.key), () => importFile(f, setProgress));
          if (!rs.length) failed.push(f.name);
          added.push(...rs);
        } catch (e) { console.error(e); failed.push(f.name); }
      }
    } finally { setBusy(false); setProgress(''); }
    if (aiProblems.length) toast(`AI reading problem – used the basic reader instead. ${[...new Set(aiProblems)][0]}`, 'error');
    if (failed.length) toast(`No recipe found in: ${failed.join(', ')}`, 'error');
    if (!added.length) return;
    setRecipes((rs) => [...rs, ...added]);
    toast(`Imported ${added.length} recipe${added.length > 1 ? 's' : ''}${aiCount ? ` (${aiCount} read by Claude)` : ''}`);
    const qs = reviewQuestions(added);
    if (qs.length) setClarify({ mode: 'import', questions: qs });
  };

  const onLoadSample = (set, mode) => {
    const fresh = set.recipes.map((r) => normalizeRecipe({ ...r, id: uid() }));
    setRecipes((rs) => (mode === 'replace' ? fresh : [...rs, ...fresh]));
    if (mode === 'replace') {
      const d = fromLocalInput(settings.time) || new Date();
      d.setHours(set.anchor.h, set.anchor.m, 0, 0);
      setSettings((s) => ({ ...s, anchor: set.anchor.mode, time: toLocalInput(d) }));
      setDismissed([]);
      toast(`Loaded “${set.name}” – ${set.anchor.mode === 'target' ? 'ready by' : 'starting at'} ${fmtClock(d)}`);
    } else toast(`Added ${fresh.length} recipes`);
  };

  const onAction = (a) => {
    let rs = recipes, st = settings;
    if (a.type === 'compromise') rs = applyCompromise(recipes, a.ids, a.temp);
    if (a.type === 'addOven') st = { ...settings, ovens: Math.min(4, settings.ovens + 1) };
    if (a.type === 'express') st = { ...settings, strategy: 'express' };
    setRecipes(rs); setSettings(st);
    build(rs, st);
  };

  const saveRecipe = (r) => {
    setRecipes((rs) => (rs.some((x) => x.id === r.id) ? rs.map((x) => (x.id === r.id ? r : x)) : [...rs, r]));
    setEditing(null);
  };

  const canGo = (i) => i < 3 || !!plan;
  return (
    <>
      <div className="min-h-screen print:hidden">
        <header className="sticky top-0 z-40 border-b border-stone-200 bg-white/85 backdrop-blur">
          <div className="mx-auto flex max-w-7xl items-center gap-3 px-4 py-3">
            <div className="grid h-10 w-10 place-items-center rounded-xl bg-gradient-to-br from-orange-500 to-red-600 text-white shadow"><Icon name="ChefHat" className="h-5 w-5" /></div>
            <div className="mr-auto">
              <div className="text-lg font-extrabold leading-tight tracking-tight">Kitchen Sync</div>
              <div className="hidden text-xs text-stone-500 sm:block">Multi-recipe cooking & baking planner</div>
            </div>
            {plan && step !== 3 && <button className={btn.secondary + ' hidden sm:inline-flex'} onClick={() => setStep(3)}><Icon name="ListChecks" />View plan</button>}
          </div>
          <nav className="mx-auto max-w-7xl px-4 pb-3" aria-label="Steps">
            <ol className="flex items-center gap-1 sm:gap-2">
              {STEPS.map((s, i) => (
                <li key={s.key} className="flex flex-1 items-center gap-1 sm:gap-2">
                  <button disabled={!canGo(i)} onClick={() => setStep(i)}
                    className={`flex w-full items-center justify-center gap-2 rounded-xl px-2 py-2 text-xs font-semibold transition sm:justify-start sm:px-3 sm:text-sm ${step === i ? 'bg-orange-600 text-white shadow-sm' : canGo(i) ? 'bg-stone-100 text-stone-600 hover:bg-stone-200' : 'bg-stone-50 text-stone-300'}`}>
                    <span className={`grid h-6 w-6 shrink-0 place-items-center rounded-full text-xs ${step === i ? 'bg-white/20' : 'bg-white'}`}>{i < step ? <Icon name="Check" className="h-3.5 w-3.5" /> : i + 1}</span>
                    <span className="hidden sm:inline">{s.label}</span>
                  </button>
                  {i < STEPS.length - 1 && <Icon name="ChevronRight" className="hidden h-4 w-4 shrink-0 text-stone-300 md:block" />}
                </li>
              ))}
            </ol>
          </nav>
        </header>

        <main className="mx-auto max-w-7xl px-4 py-6 sm:py-8">
          {step === 0 && <KitchenStep settings={settings} setSettings={setSettings} recipes={recipes} />}
          {step === 1 && <RecipesStep recipes={recipes} setRecipes={setRecipes} onEdit={setEditing} onImport={onImport} busy={busy} progress={progress} onLoadSample={onLoadSample} ai={ai} setAi={setAi} hosted={hosted} />}
          {step === 2 && <ScheduleStep settings={settings} setSettings={setSettings} recipes={recipes} onGenerate={requestBuild} />}
          {step === 3 && <PlanStep plan={plan} stale={stale} onRebuild={requestBuild} checked={checked} setChecked={setChecked} onAction={onAction} toast={toast} />}

          {step < 3 && (
            <div className="mt-8 flex items-center justify-between border-t border-stone-200 pt-5">
              <button className={btn.secondary} disabled={step === 0} onClick={() => setStep(step - 1)}><Icon name="ChevronLeft" />Back</button>
              {step < 2
                ? <button className={btn.primary} onClick={() => setStep(step + 1)}>Next: {STEPS[step + 1].label}<Icon name="ChevronRight" /></button>
                : <button className={btn.primary} disabled={!recipes.length} onClick={requestBuild}><Icon name="Wand2" />Build plan</button>}
            </div>
          )}
          {step === 3 && (
            <div className="mt-6 flex justify-between">
              <button className={btn.secondary} onClick={() => setStep(2)}><Icon name="ChevronLeft" />Adjust settings</button>
              <button className={btn.ghost} onClick={requestBuild}><Icon name="RotateCcw" />Rebuild</button>
            </div>
          )}
        </main>
        <footer className="mx-auto max-w-7xl px-4 pb-10 text-xs text-stone-400">
          Oven model: preheat ≈20°F/min, cool-down ≈8°F/min with the door cracked; temperature nudges add ~10% time per 25°F. Your data stays in this browser.
        </footer>
      </div>

      <PrintView plan={plan} checked={checked} />

      {editing && <RecipeEditor recipe={editing} onSave={saveRecipe} onClose={() => setEditing(null)} />}
      {clarify && <ClarifyModal key={clarify.questions.map((q) => q.key).join()} data={clarify} onApply={applyAnswers} onClose={() => setClarify(null)} />}

      <div className="pointer-events-none fixed bottom-4 left-1/2 z-[60] flex w-[calc(100%-2rem)] max-w-sm -translate-x-1/2 flex-col gap-2 print:hidden">
        {toasts.map((t) => (
          <div key={t.id} className={`pointer-events-auto flex items-center gap-2 rounded-xl px-4 py-3 text-sm font-medium text-white shadow-lg ${t.kind === 'error' ? 'bg-red-600' : 'bg-stone-900'}`}>
            <Icon name={t.kind === 'error' ? 'AlertTriangle' : 'CheckCircle2'} className="h-4 w-4 shrink-0" />{t.msg}
          </div>
        ))}
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
