/* ================================================================

const DUR_SRC = String.raw`(\d+(?:[.,]\d+)?(?:\s*(?:-|–|to)\s*\d+(?:[.,]\d+)?)?\s*(?:hours?|hrs?|h|minutes?|mins?|m)\b(?:\s*(?:and\s*)?\d+\s*(?:minutes?|mins?|m)\b)?)`;
function parseMinutes(str) {
  if (str == null || str === '') return null;
  if (typeof str === 'number') return Math.round(str);
  let s = String(str).trim();
  if (/^P/i.test(s)) {
    const iso = s.match(/^P(?:(\d+)D)?T?(?:(\d+(?:\.\d+)?)H)?(?:(\d+(?:\.\d+)?)M)?/i);

  s = s.toLowerCase().replace(/½/g, '.5').replace(/¼/g, '.25').replace(/¾/g, '.75').replace(/(\d),(\d)/g, '$1.$2');

  let total = 0, found = false;
  const h = s.match(/(\d+(?:\.\d+)?)\s*(?:hours?|hrs?|h)\b/); if (h) { total += parseFloat(h[1]) * 60; found = true; }

}

function detectTemp(text) {

    const fr = new FileReader();

      i.src = url;

    const canvas = document.createElement('canvas');
    canvas.width = Math.round(img.naturalWidth * scale);
    canvas.height = Math.round(img.naturalHeight * scale);

function peakLoad(ivs, s, e) {
  const pts = [];
  for (const iv of ivs) if (iv.s < e && iv.e > s) pts.push([Math.max(iv.s, s), iv.w], [Math.min(iv.e, e), -iv.w]);
  pts.sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  let cur = 0, peak = 0;
  for (const [, w] of pts) { cur += w; if (cur > peak) peak = cur; }
  return peak;
}

/* Turn a recipe into ordered stages of tasks: prep → wait → active → passive (batches in parallel). Rest is attached after. */
function buildStages(r, settings) {

  const has = { prep: r.prepTime > 0, active: r.activeTime > 0, passive: !!passiveKind };

  const assign = (names, order) => names.forEach((nm) => { const k = order.find((x) => has[x]); if (k) eq[k].push(nm); });
  groups.stove.forEach((nm) => {
    let used = false;
    if (has.active && r.activeOnStove) { eq.active.push(nm); used = true; }
    if (passiveKind === 'simmer') { eq.passive.push(nm); used = true; }
    if (!used) assign([nm], ['active', 'passive', 'prep']);

  assign(groups.handson, ['active', 'prep']);
  assign(groups.bake, passiveKind === 'bake' || passiveKind === 'hold' ? ['passive', 'active'] : ['active', 'prep']);

  const base = { recipeId: r.id, exclusive: !r.concurrent };
  const stages = [];
  if (r.prepTime) stages.push([{ ...base, id: `${r.id}-prep-1`, kind: 'prep', dur: r.prepTime, hands: true, equip: eq.prep }]);
  if (r.waitTime) stages.push([{ ...base, id: `${r.id}-wait-1`, kind: 'wait', dur: r.waitTime, equip: [] }]);
  if (r.activeTime) stages.push([{ ...base, id: `${r.id}-active-1`, kind: 'active', dur: r.activeTime, hands: true, burner: r.activeOnStove, equip: eq.active }]);
  if (passiveKind) {

      ...base, id: `${r.id}-${passiveKind}-${i + 1}`, kind: passiveKind, dur: r.passiveTime, batch: i + 1, batches: n,

  const placed = [];
  const iv = (p, w = 1, pad = 0) => ({ s: p.start, e: p.end + pad, w });

  function check(task, s, e, oven, temp) {
    if (lowerBound != null && s < lowerBound) return false;
    if (task.hands) {
      const b = sp.cookBuffer;
      const ov = placed.filter((p) => p.hands && p.start < e + b && p.end + b > s);
      if (ov.length && (task.exclusive || ov.some((p) => p.exclusive))) return false;
      if (peakLoad(ov.map((p) => iv(p, 1, b)), s, e + b) + 1 > settings.cooks) return false;
    }
    if (task.burner) {
      const ov = placed.filter((p) => p.burner && p.start < e && p.end > s);
      if (peakLoad(ov.map((p) => iv(p)), s, e) + 1 > settings.burners) return false;
    }
    for (const nm of task.equip || []) {
      const key = nm.toLowerCase();
      const ov = placed.filter((p) => p.start < e && p.end > s && (p.equip || []).some((x) => x.toLowerCase() === key));
      if (peakLoad(ov.map((p) => iv(p)), s, e) + 1 > eqCount(settings, nm)) return false;
    }
    if (task.oven) {
      const occ = placed.filter((p) => p.oven === oven);
      let hotBefore = false;
      for (const p of occ) {
        if (p.start < e && p.end > s) {
          if (!sp.share || task.exclusive || p.exclusive || p.temp !== temp) return false;
          if (p.start <= s) hotBefore = true;
        } else if (p.end <= s) {
          hotBefore = true;
          if (s - p.end < transMin(p.temp, temp) + sp.ovenBuffer) return false;
        } else if (p.start - e < transMin(temp, p.temp) + sp.ovenBuffer) return false;
      }
      const ovl = occ.filter((p) => p.start < e && p.end > s);
      if (peakLoad(ovl.map((p) => iv(p, p.racks)), s, e) + task.racks > settings.racks) return false;
      if (!hotBefore && lowerBound != null && s - transMin(AMBIENT, temp) < lowerBound) return false;
    }
    return true;
  }

  function candidates(task, s0, dir) {
    if (!task.oven) return [{ oven: null, temp: null, dur: task.dur }];
    const list = [];
    for (let o = 0; o < settings.ovens; o++) list.push({ oven: o, temp: task.temp, dur: task.dur });
    if (sp.share && sp.tolerance > 0 && !task.exclusive) {
      const seen = new Set();
      for (const p of placed) {
        if (p.oven == null || p.exclusive || p.temp === task.temp || Math.abs(p.temp - task.temp) > sp.tolerance) continue;
        const k = p.oven + ':' + p.temp;
        if (seen.has(k)) continue;
        seen.add(k);
        list.push({ oven: p.oven, temp: p.temp, dur: adjDur(task.dur, task.temp, p.temp), adjusted: true });
      }
    }
    return list;
  }

  const commit = (task, fields) => { const p = { ...task, ...fields }; placed.push(p); return p; };

  function place(task, bound, dir) {
    const free = !task.hands && !task.burner && !task.oven && !(task.equip || []).length;
    if (free) { const s = dir > 0 ? bound : bound - task.dur; return commit(task, { start: s, end: s + task.dur }); }
    const start = dir > 0 ? ceilTo(bound) : floorTo(bound);
    const cands = candidates(task);
    for (let k = 0; k <= 864; k++) {           // search up to 3 days in 5-min steps
      const a = start + dir * k * 5;
      for (const c of cands) {
        const s = dir > 0 ? a : a - c.dur, e = s + c.dur;
        if (c.adjusted && !placed.some((p) => p.oven === c.oven && p.temp === c.temp && p.start < e && p.end > s)) continue;
        if (check(task, s, e, c.oven, c.temp)) {
          return commit(task, { start: s, end: e, dur: c.dur, oven: c.oven, temp: c.temp, adjusted: c.adjusted ? { fromTemp: task.temp, fromDur: task.dur } : null });
        }
      }
    }
    return null;
  }
  return { placed, place, addFree: (task, start) => commit(task, { start, end: start + task.dur }) };
}

function scheduleAll(recipes, settings, sp, dir, bound) {
  const eng = makeEngine(settings, sp, dir > 0 ? bound : null);
  const order = [...recipes].sort((a, b) => chainLen(b) - chainLen(a) || isOvenRecipe(b) - isOvenRecipe(a));
  const ready = {}, failures = [];
  for (const r of order) {
    const { stages, rest } = buildStages(r, settings);
    let restStart;
    if (dir > 0) {
      let b = bound;
      for (const st of stages) {
        let mx = b;
        for (const t of st) {
          const p = eng.place(t, b, 1);
          if (!p) { failures.push({ recipe: r, task: t }); continue; }
          mx = Math.max(mx, p.end);
        }
        b = mx;
      }
      restStart = b;
    } else {
      let b = bound - rest;
      restStart = null;
      for (let i = stages.length - 1; i >= 0; i--) {
        let mn = b;
        for (const t of stages[i]) {
          const p = eng.place(t, b, -1);
          if (!p) { failures.push({ recipe: r, task: t }); continue; }
          mn = Math.min(mn, p.start);
          if (i === stages.length - 1) restStart = Math.max(restStart ?? -Infinity, p.end);
        }
        b = mn;
      }
      if (restStart == null) restStart = bound - rest;
    }
    if (rest) eng.addFree({ id: `${r.id}-rest-1`, recipeId: r.id, kind: 'rest', dur: rest, equip: [] }, restStart);
    ready[r.id] = restStart + rest;
  }
  const readyVals = Object.values(ready);
  return { placements: eng.placed, ready, failures, order: order.map((r) => r.id), readyMax: readyVals.length ? Math.max(...readyVals) : bound };
}

/* Derive what each oven is doing between bakes: preheat, raise, lower, off. */
function ovenTimeline(placements, settings) {
  const segs = [];
  for (let o = 0; o < settings.ovens; o++) {
    const occ = placements.filter((p) => p.oven === o).sort((a, b) => a.start - b.start);
    let st = { on: false, temp: AMBIENT, until: -Infinity };
    for (const p of occ) {
      if (st.on && p.start < st.until && p.temp === st.temp) { st.until = Math.max(st.until, p.end); continue; }
      const gap = p.start - st.until;
      if (st.on && gap > 60 + transMin(AMBIENT, p.temp)) { segs.push({ type: 'off', oven: o, start: st.until, end: st.until }); st.on = false; }
      if (!st.on) {
        const d = transMin(AMBIENT, p.temp);
        segs.push({ type: 'preheat', oven: o, start: p.start - d, end: p.start, from: AMBIENT, to: p.temp });
      } else if (p.temp !== st.temp) {
        const d = transMin(st.temp, p.temp);
        if (p.temp > st.temp) segs.push({ type: 'raise', oven: o, start: p.start - d, end: p.start, from: st.temp, to: p.temp });
        else segs.push({ type: 'lower', oven: o, start: st.until, end: Math.min(p.start, st.until + d), from: st.temp, to: p.temp });
      }
      st = { on: true, temp: p.temp, until: Math.max(p.end, st.on && st.temp === p.temp ? st.until : -Infinity) };
    }
    if (st.on) segs.push({ type: 'off', oven: o, start: st.until, end: st.until });
  }
  return segs;
}

function idealOvenConflicts(recipes, settings, sp, dir) {
  const wins = recipes.filter(isOvenRecipe).map((r) => {
    const rounds = Math.ceil(r.batches / (r.fullOven ? 1 : settings.racks));
    const len = r.passiveTime * rounds;
    const s = dir < 0 ? -r.restTime - len : r.prepTime + r.waitTime + r.activeTime;
    return { r, s, e: s + len, T: r.ovenTemp };
  });
  const out = [];
  for (let i = 0; i < wins.length; i++) for (let j = i + 1; j < wins.length; j++) {
    const a = wins[i], b = wins[j];
    const diff = Math.abs(a.T - b.T);
    if (diff <= sp.tolerance) continue;
    const os = Math.max(a.s, b.s), oe = Math.min(a.e, b.e);
    if (oe <= os) continue;
    const temps = wins.filter((w) => w.s < oe && w.e > os).map((w) => w.T).sort((x, y) => x - y);
    let clusters = 0, last = -Infinity;
    for (const t of temps) if (t - last > sp.tolerance) { clusters++; last = t; }
    if (clusters > settings.ovens) out.push({ a: a.r, b: b.r, diff, key: [a.r.id, b.r.id, a.T, b.T, settings.ovens].join('|') });
  }
  return out;
}

function generatePlan(recipesIn, settings) {
  const recipes = recipesIn.map(normalizeRecipe);
  const sp = stratParams(settings);
  const anchor = fromLocalInput(settings.time) || new Date();
  const byId = Object.fromEntries(recipes.map((r) => [r.id, r]));
  let run, serveAt, synced = false;

  if (settings.anchor === 'target') {
    run = scheduleAll(recipes, settings, sp, -1, 0);
    serveAt = 0;
  } else {
    const fwd = scheduleAll(recipes, settings, sp, 1, 0);
    run = fwd;
    if (!fwd.failures.length && recipes.length > 1) {
      // Try a "synchronized finish": schedule backwards from the forward finish so dishes land together.
      const sync = scheduleAll(recipes, settings, sp, -1, fwd.readyMax);
      if (!sync.failures.length) {
        const segs = ovenTimeline(sync.placements, settings);
        const minT = Math.min(...sync.placements.map((p) => p.start), ...segs.map((s) => s.start));
        sync.placements.forEach((p) => { p.start -= minT; p.end -= minT; });
        Object.keys(sync.ready).forEach((k) => (sync.ready[k] -= minT));
        sync.readyMax -= minT;
        if (sync.readyMax <= fwd.readyMax + (settings.strategy === 'chill' ? 20 : 0)) { run = sync; synced = true; }
      }
    }
    serveAt = run.readyMax;
  }

  const placements = run.placements.sort((a, b) => a.start - b.start);
  const segs = ovenTimeline(placements, settings);
  const t0 = Math.min(serveAt, ...placements.map((p) => p.start), ...segs.map((s) => s.start));
  const t1 = Math.max(serveAt, ...placements.map((p) => p.end));
  const serveDay = atMin(anchor, serveAt);
  const T = (m) => fmtAt(anchor, m, serveDay);

  /* ---------- checklist events ---------- */
  const events = [];
  const ev = (id, t, kind, text, detail = '', recipeId = null, order = 5) => events.push({ id, t, kind, text, detail, recipeId, order });
  for (const s of segs) {
    const o = `Oven ${s.oven + 1}`;
    if (s.type === 'preheat') ev(`ov${s.oven}-pre-${s.start}`, s.start, 'oven', `Preheat ${o} to ${s.to}°F`, `About ${fmtDur(s.end - s.start)} to come to temperature.`, null, 0);
    if (s.type === 'raise') ev(`ov${s.oven}-up-${s.start}`, s.start, 'oven', `Raise ${o} to ${s.to}°F`, `From ${s.from}°F – allow ~${fmtDur(s.end - s.start)}.`, null, 0);
    if (s.type === 'lower') ev(`ov${s.oven}-down-${s.start}`, s.start, 'oven', `Lower ${o} to ${s.to}°F`, `Crack the door for a few minutes to cool from ${s.from}°F faster (~${fmtDur(transMin(s.from, s.to))}).`, null, 1);
    if (s.type === 'off') ev(`ov${s.oven}-off-${s.start}`, s.start, 'oven', `Turn off ${o}`, '', null, 9);
  }
  for (const p of placements) {
    const r = byId[p.recipeId];
    const nm = r.name || 'Untitled';
    const batch = p.batches > 1 ? ` (batch ${p.batch} of ${p.batches})` : '';
    const eqTxt = (p.equip || []).length ? `Use: ${p.equip.join(', ')}. ` : '';
    const firstNote = (r.notes || '').split(/(?<=[.!?])\s/)[0].slice(0, 180);
    if (p.kind === 'prep') ev(`${p.id}:s`, p.start, 'prep', `Prep ${nm}`, `${eqTxt}${fmtDur(p.dur)} hands-on. ${firstNote}`, r.id, 3);
    if (p.kind === 'wait') ev(`${p.id}:s`, p.start, 'wait', `${r.waitLabel || 'Chill / rise'}: ${nm}`, `Hands-off for ${fmtDur(p.dur)}.`, r.id, 4);
    if (p.kind === 'active') ev(`${p.id}:s`, p.start, 'active', p.burner ? `Cook ${nm} on the stovetop` : `Hands-on: shape / assemble ${nm}`, `${eqTxt}${fmtDur(p.dur)} of active work.`, r.id, 3);
    if (p.kind === 'bake') {
      const adj = p.adjusted ? ` Sharing the oven at ${p.temp}°F (recipe says ${p.adjusted.fromTemp}°F) – time adjusted ${p.adjusted.fromDur} → ${p.dur} min; check for doneness early.` : '';
      ev(`${p.id}:s`, p.start, 'bake', `Put ${nm}${batch} in Oven ${p.oven + 1} at ${p.temp}°F`, `Set a timer for ${fmtDur(p.dur)}. ${eqTxt}${adj}`, r.id, 2);
      ev(`${p.id}:e`, p.end, 'bake', `Take ${nm}${batch} out of Oven ${p.oven + 1}`, '', r.id, 1);
    }
    if (p.kind === 'simmer') {
      ev(`${p.id}:s`, p.start, 'simmer', `Simmer ${nm}${batch} on a burner`, `Set a timer for ${fmtDur(p.dur)}. ${eqTxt}`, r.id, 2);
      ev(`${p.id}:e`, p.end, 'simmer', `Take ${nm}${batch} off the heat`, '', r.id, 1);
    }
    if (p.kind === 'hold') ev(`${p.id}:s`, p.start, 'hold', `${nm}: hands-off to set / chill`, `${fmtDur(p.dur)}. ${eqTxt}`, r.id, 4);
    if (p.kind === 'rest') ev(`${p.id}:s`, p.start, 'rest', `Rest / cool ${nm}`, `${fmtDur(p.dur)} – tent or leave on a rack.`, r.id, 2);
  }
  for (const r of recipes) {
    const at = run.ready[r.id];
    const early = serveAt - at;
    ev(`${r.id}:ready`, at, 'ready', `${r.name || 'Untitled'} is ready`,
      early > 15 ? (r.category === 'Dessert' || r.restTime >= 60 ? `Made ahead – set aside until serving (${fmtDur(early)}).` : `Ready ${fmtDur(early)} before serving – keep covered / warm.`) : '', r.id, 6);
  }
  // Breaks: gaps in hands-on work (Chill mode emphasizes them).
  const hands = placements.filter((p) => p.hands).sort((a, b) => a.start - b.start);
  let lastEnd = null;
  for (const p of hands) {
    if (lastEnd != null && p.start - lastEnd >= (settings.strategy === 'chill' ? 15 : 30)) {
      ev(`break-${lastEnd}`, lastEnd, 'break', 'Break – nothing hands-on', `Free until ${T(p.start)} (${fmtDur(p.start - lastEnd)}). ${settings.strategy === 'chill' ? 'Tidy up, refill your drink, put your feet up.' : 'Good time to wash up and set the table.'}`, null, 7);
    }
    lastEnd = Math.max(lastEnd ?? -Infinity, p.end);
  }
  ev('serve', serveAt, 'serve', settings.anchor === 'target' ? 'Serve! Everything is on the table' : 'Everything is ready – serve!', '', null, 8);
  events.sort((a, b) => a.t - b.t || a.order - b.order);

  /* ---------- alerts: conflicts, adjustments, warnings ---------- */
  const alerts = [];
  for (const f of run.failures) alerts.push({ id: `fail-${f.task.id}`, severity: 'error', title: `Couldn't fit “${f.recipe.name}” (${f.task.kind})`, body: 'No slot found within 3 days – check ovens, burners and equipment counts in Kitchen Setup.' });
  const bakesOf = (id) => placements.filter((p) => p.recipeId === id && p.kind === 'bake');
  const spanTxt = (ps) => ps.length ? `${T(Math.min(...ps.map((p) => p.start)))}–${T(Math.max(...ps.map((p) => p.end)))} in Oven ${[...new Set(ps.map((p) => p.oven + 1))].join(' & ')}` : 'n/a';
  for (const c of idealOvenConflicts(recipes, settings, sp, settings.anchor === 'target' ? -1 : 1)) {
    const [hot, cool] = c.a.ovenTemp >= c.b.ovenTemp ? [c.a, c.b] : [c.b, c.a];
    const firstStart = (r) => Math.min(...bakesOf(r.id).map((p) => p.start), Infinity);
    const orderTip = firstStart(cool) <= firstStart(hot)
      ? `${cool.name} goes first because ovens heat up faster than they cool down.`
      : `${hot.name} goes first (it ${hot.restTime >= 60 ? 'needs time to cool' : 'fits better that way'}); allow ~${fmtDur(transMin(hot.ovenTemp, cool.ovenTemp))} for the oven to drop to ${cool.ovenTemp}°F.`;
    const actions = [];
    if (c.diff <= 75) {
      const mid = Math.round((c.a.ovenTemp + c.b.ovenTemp) / 2 / 25) * 25;
      const da = adjDur(c.a.passiveTime, c.a.ovenTemp, mid), db = adjDur(c.b.passiveTime, c.b.ovenTemp, mid);
      actions.push({ label: `Bake both at ${mid}°F`, hint: `${c.a.name} ${c.a.passiveTime}→${da} min · ${c.b.name} ${c.b.passiveTime}→${db} min`, action: { type: 'compromise', ids: [c.a.id, c.b.id], temp: mid } });
    }
    if (settings.strategy === 'chill' && c.diff <= 25) actions.push({ label: 'Switch to Express mode', hint: 'Lets dishes within 25°F share an oven', action: { type: 'express' } });
    if (settings.ovens < 4) actions.push({ label: 'I have another oven', hint: 'Countertop / toaster oven counts too', action: { type: 'addOven' } });
    alerts.push({
      id: 'conf-' + c.key, severity: c.diff >= 75 ? 'warning' : 'conflict',
      title: `${c.a.name} (${c.a.ovenTemp}°F) and ${c.b.name} (${c.b.ovenTemp}°F) want the oven at the same time`,
      body: `They're ${c.diff}°F apart${c.diff >= 75 ? ' – too far to share' : ''}. Kitchen Sync staggered them: ${c.a.name} ${spanTxt(bakesOf(c.a.id))}; ${c.b.name} ${spanTxt(bakesOf(c.b.id))}. ${orderTip}`,
      actions,
    });
  }
  for (const p of placements.filter((x) => x.adjusted)) {
    alerts.push({ id: 'adj-' + p.id, severity: 'info', title: `${byId[p.recipeId].name} shares Oven ${p.oven + 1} at ${p.temp}°F`,
      body: `Recipe calls for ${p.adjusted.fromTemp}°F; baking at ${p.temp}°F alongside another dish, so time goes ${p.adjusted.fromDur} → ${p.dur} min${p.batches > 1 ? ` (batch ${p.batch})` : ''}. Check doneness a few minutes early.` });
  }
  if (settings.anchor === 'target') {
    for (const r of recipes) {
      const early = serveAt - run.ready[r.id];
      if (early > 30 && r.category !== 'Dessert' && r.restTime < 60) {
        alerts.push({ id: 'early-' + r.id, severity: 'warning', title: `${r.name} will be ready ${fmtDur(early)} early`,
          body: `Equipment or oven space forced it earlier. Keep it covered and warm, or reheat 10–15 min before serving.`,
          actions: settings.ovens < 4 && isOvenRecipe(r) ? [{ label: 'I have another oven', hint: 'Re-plan with one more oven', action: { type: 'addOven' } }] : [] });
      }
    }
  }
  const eqUse = {};
  recipes.forEach((r) => r.equipment.forEach((n) => { if (equipGroup(n) !== 'tool') (eqUse[n.toLowerCase()] ||= { name: n, users: [] }).users.push(r.name); }));
  Object.values(eqUse).forEach((u) => {
    const cap = eqCount(settings, u.name);
    if (u.users.length > cap) alerts.push({ id: 'eq-' + u.name, severity: 'info', title: `${u.name} is shared by ${u.users.length} recipes (you have ${cap})`, body: `${u.users.join(', ')} – Kitchen Sync makes sure they never need it at the same time. Add more in Kitchen Setup if you own extras.` });
  });
  if (synced) alerts.push({ id: 'sync', severity: 'info', title: 'Synchronized finish', body: 'Dishes were scheduled so they finish together instead of sitting around after an early start.' });
  if (t1 - t0 > 16 * 60) alerts.push({ id: 'long', severity: 'info', title: `This plan spans ${fmtDur(t1 - t0)}`, body: 'Consider making long-resting items (pies, doughs) the day before.' });

  /* ---------- Gantt rows ---------- */
  const rows = [];
  const order = run.order;
  order.forEach((id, idx) => {
    const r = byId[id];
    const items = placements.filter((p) => p.recipeId === id).map((p) => ({
      start: p.start, end: p.end, kind: p.kind, adjusted: !!p.adjusted,
      label: p.kind === 'bake' ? `${p.temp}°${p.batches > 1 ? ` #${p.batch}` : ''}` : p.kind === 'simmer' && p.batches > 1 ? `#${p.batch}` : PHASES[p.kind].label,
      tip: `${r.name} – ${PHASES[p.kind].label}${p.batches > 1 ? ` (batch ${p.batch})` : ''}: ${T(p.start)}–${T(p.end)}${p.oven != null ? ` · Oven ${p.oven + 1} @ ${p.temp}°F` : ''}`,
    }));
    if (run.ready[id] < serveAt - 5) items.push({ start: run.ready[id], end: serveAt, kind: 'warm', label: 'Hold', tip: `${r.name} – waiting ${fmtDur(serveAt - run.ready[id])} until serving` });
    rows.push({ key: id, label: r.name || 'Untitled', sub: r.category, color: RECIPE_COLORS[recipes.indexOf(r) % RECIPE_COLORS.length], items });
  });
  for (let o = 0; o < settings.ovens; o++) {
    const items = placements.filter((p) => p.oven === o).map((p) => ({
      start: p.start, end: p.end, kind: 'bake', adjusted: !!p.adjusted, label: `${byId[p.recipeId].name} ${p.temp}°`,
      tip: `Oven ${o + 1}: ${byId[p.recipeId].name} @ ${p.temp}°F, ${T(p.start)}–${T(p.end)}`,
    }));
    segs.filter((s) => s.oven === o && s.type !== 'off').forEach((s) => items.push({
      start: s.start, end: s.end, kind: 'preheat', label: `→${s.to}°`, tip: `Oven ${o + 1}: ${s.type} ${s.from}°F → ${s.to}°F, ${T(s.start)}–${T(s.end)}`,
    }));
    rows.push({ key: 'oven' + o, label: `Oven ${o + 1}`, sub: `${settings.racks} rack${settings.racks > 1 ? 's' : ''}`, lane: true, items });
  }
  rows.push({ key: 'serve', label: 'Serve', sub: T(serveAt), lane: true, items: [{ start: serveAt, end: serveAt + 20, kind: 'serve', label: 'Serve', tip: `Serve at ${T(serveAt)}` }] });
  rows.forEach((row) => {        // pack overlapping bars into sub-lanes
    const ends = [];
    row.items.sort((a, b) => a.start - b.start).forEach((it) => {
      let l = ends.findIndex((e) => e <= it.start);
      if (l < 0) { l = ends.length; ends.push(0); }
      ends[l] = it.end; it.lane = l;
    });
    row.lanes = Math.max(1, ends.length);
  });

  const handsOn = placements.filter((p) => p.hands).reduce((s, p) => s + p.dur, 0);
  const ovenMin = placements.filter((p) => p.kind === 'bake').reduce((s, p) => s + p.dur, 0);
  return {
    createdAt: Date.now(), base: anchor.getTime(), serveAt, t0, t1, placements, segs, events, alerts, rows,
    recipes: byId, order, anchorMode: settings.anchor, strategy: settings.strategy,
    settings: { ovens: settings.ovens, racks: settings.racks, burners: settings.burners, cooks: settings.cooks },
    stats: { start: t0, end: serveAt, total: serveAt - t0, handsOn, ovenMin, steps: events.length },
  };
}

/* ================================================================
   Validation → clarifying questions
   ================================================================ */
const REVIEW_Q = {
  name: (r) => ({ q: `What should we call this recipe?`, input: 'text', field: 'name', value: r.name }),
  prepTime: (r) => ({ q: `How many minutes of prep (chopping, mixing) does “${r.name}” need?`, input: 'number', field: 'prepTime', unit: 'min', value: r.prepTime || 15 }),
  passiveTime: (r) => ({ q: `How long does “${r.name}” bake / cook unattended?`, input: 'number', field: 'passiveTime', unit: 'min', value: r.passiveTime || 30 }),
  activeTime: (r) => ({ q: `How many minutes of hands-on stovetop cooking for “${r.name}”?`, input: 'number', field: 'activeTime', unit: 'min', value: r.activeTime || 15 }),
  ovenTemp: (r) => ({ q: `What oven temperature does “${r.name}” need?`, input: 'number', field: 'ovenTemp', unit: '°F', value: r.ovenTemp || 350 }),
  category: (r) => ({ q: `What kind of dish is “${r.name}”?`, input: 'select', options: CATEGORIES, field: 'category', value: r.category === 'Other' ? 'Side' : r.category }),
};
function reviewQuestions(recipes) {
  const qs = [];
  for (const r of recipes) for (const f of r._review || []) {
    if (REVIEW_Q[f]) qs.push({ key: `${r.id}.${f}`, recipeId: r.id, severity: 'review', ...REVIEW_Q[f](r) });
  }
  return qs;
}
function validate(recipes, settings, dismissed = []) {
  const qs = [];
  const add = (q) => qs.push(q);
  if (!fromLocalInput(settings.time)) add({ key: 'time', severity: 'error', q: settings.anchor === 'target' ? 'When do you want to serve?' : 'When do you want to start cooking?', input: 'datetime', field: 'time', value: toLocalInput(new Date()) });
  for (const r0 of recipes) {
    const r = normalizeRecipe(r0);
    const nm = r.name || 'this recipe';
    if (!r.name.trim()) add({ key: `${r.id}.name`, recipeId: r.id, severity: 'error', q: 'One recipe has no name – what is it?', input: 'text', field: 'name', value: 'Untitled dish' });
    if (r.prepTime + r.waitTime + r.activeTime + r.passiveTime + r.restTime === 0) add({ key: `${r.id}.prep0`, recipeId: r.id, severity: 'error', q: `“${nm}” has no times at all. How many minutes of prep?`, input: 'number', field: 'prepTime', unit: 'min', value: 15 });
    if (r.passiveWhere === 'oven' && r.passiveTime > 0 && !r.ovenTemp) add({ key: `${r.id}.temp`, recipeId: r.id, severity: 'error', q: `What oven temperature does “${nm}” bake at?`, input: 'number', field: 'ovenTemp', unit: '°F', value: 350 });
    if (r.passiveWhere === 'oven' && r.ovenTemp > 0 && r.passiveTime === 0) add({ key: `${r.id}.bake0`, recipeId: r.id, severity: 'warning', q: `“${nm}” has an oven temperature but no bake time. How long does it bake?`, input: 'number', field: 'passiveTime', unit: 'min', value: 30 });
    if (isOvenRecipe(r) && r.ovenTemp > 0 && (r.ovenTemp > 550 || r.ovenTemp < 150)) add({ key: `${r.id}.tempodd`, recipeId: r.id, severity: 'warning', q: `${r.ovenTemp}°F looks unusual for “${nm}” – is that right?`, input: 'number', field: 'ovenTemp', unit: '°F', value: r.ovenTemp });
    if (r.passiveTime > 12 * 60 || r.prepTime > 8 * 60) add({ key: `${r.id}.long`, recipeId: r.id, severity: 'warning', q: `“${nm}” takes over ${fmtDur(Math.max(r.passiveTime, r.prepTime))}. Confirm the unattended cook time:`, input: 'number', field: 'passiveTime', unit: 'min', value: r.passiveTime });
  }
  const norm = recipes.map(normalizeRecipe);
  if (norm.some(isOvenRecipe) && settings.ovens < 1) add({ key: 'ovens', severity: 'error', q: 'Some recipes need an oven. How many ovens do you have?', input: 'number', field: 'ovens', value: 1 });
  if (norm.some(usesBurner) && settings.burners < 1) add({ key: 'burners', severity: 'error', q: 'Some recipes need the stovetop. How many burners can you use?', input: 'number', field: 'burners', value: 4 });
  if (settings.anchor === 'target') {
    const t = fromLocalInput(settings.time);
    if (t && t < new Date() && !dismissed.includes('past')) add({ key: 'past', severity: 'warning', q: 'Your serving time is in the past. Want to change it?', input: 'datetime', field: 'time', value: settings.time, dismissKey: 'past' });
  }
  // Oven conflicts – ask how to handle them.
  if (norm.length && settings.ovens > 0) {
    for (const c of idealOvenConflicts(norm, settings, stratParams(settings), settings.anchor === 'target' ? -1 : 1)) {
      if (dismissed.includes(c.key)) continue;
      const mid = Math.round((c.a.ovenTemp + c.b.ovenTemp) / 2 / 25) * 25;
      const options = [{ value: 'stagger', label: 'Stagger them automatically (recommended)' }];
      if (c.diff <= 75) options.push({ value: 'compromise', label: `Bake both at ${mid}°F and adjust times` });
      if (settings.ovens < 4) options.push({ value: 'addOven', label: 'I have another oven' });
      add({ key: 'conf-' + c.key, severity: 'conflict', input: 'choice', options, value: 'stagger', dismissKey: c.key,
        q: `${c.a.name} (${c.a.ovenTemp}°F) and ${c.b.name} (${c.b.ovenTemp}°F) both want the oven at the same time – ${c.diff}°F apart. How should we handle it?`,
        conflict: { ids: [c.a.id, c.b.id], temp: mid } });
    }
  }
  return qs;
}
function applyCompromise(recipes, ids, temp) {
  return recipes.map((r) => ids.includes(r.id) && r.ovenTemp !== temp
    ? { ...r, passiveTime: adjDur(r.passiveTime, r.ovenTemp, temp), ovenTemp: temp, notes: `${r.notes ? r.notes + '\n' : ''}[Kitchen Sync] Adjusted from ${r.ovenTemp}°F / ${r.passiveTime} min to share the oven.` }
    : r);
}

const csvCell = (v) => { const s = String(v ?? ''); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
function planRows(plan) {
  const base = new Date(plan.base);
  const serveDay = atMin(base, plan.serveAt);
  return plan.events.map((e) => ({
    Time: fmtAt(base, e.t, serveDay),
    Date: atMin(base, e.t).toLocaleDateString(),
    'Minutes from start': e.t - plan.t0,
    Recipe: e.recipeId ? plan.recipes[e.recipeId].name : '',
    Phase: e.kind === 'oven' ? 'Oven' : e.kind === 'ready' ? 'Ready' : e.kind === 'break' ? 'Break' : (PHASES[e.kind] || {}).label || e.kind,
    Step: e.text, Details: e.detail,
  }));
}
function timelineRows(plan) {
  const base = new Date(plan.base);
  const serveDay = atMin(base, plan.serveAt);
  return plan.placements.map((p) => ({
    Recipe: plan.recipes[p.recipeId].name, Phase: PHASES[p.kind].label + (p.batches > 1 ? ` (batch ${p.batch})` : ''),
    Start: fmtAt(base, p.start, serveDay), End: fmtAt(base, p.end, serveDay), 'Duration (min)': p.dur,
    Oven: p.oven != null ? `Oven ${p.oven + 1}` : '', 'Temp (°F)': p.temp || '', Equipment: (p.equip || []).join(', '),
  }));
}
function exportCSV(plan, checked) {
  const rows = planRows(plan);
  const heads = ['Done', ...Object.keys(rows[0] || {})];
  const lines = [heads.join(',')];
  rows.forEach((r, i) => lines.push([checked[plan.events[i].id] ? 'x' : '', ...Object.values(r)].map(csvCell).join(',')));
  lines.push('', 'TIMELINE');
  const tl = timelineRows(plan);
  if (tl.length) { lines.push(Object.keys(tl[0]).join(',')); tl.forEach((r) => lines.push(Object.values(r).map(csvCell).join(','))); }
  download(`kitchen-sync-${slug(new Date(plan.base).toDateString())}.csv`, new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' }));
}
async function exportXLSX(plan, checked) {
  await loadScript(LIBS.xlsx);
  const X = window.XLSX;
  const wb = X.utils.book_new();
  const cl = planRows(plan).map((r, i) => ({ Done: checked[plan.events[i].id] ? '✔' : '', ...r }));
  const s1 = X.utils.json_to_sheet(cl);
  s1['!cols'] = [{ wch: 6 }, { wch: 16 }, { wch: 11 }, { wch: 9 }, { wch: 26 }, { wch: 18 }, { wch: 44 }, { wch: 70 }];
  X.utils.book_append_sheet(wb, s1, 'Master Checklist');
  const s2 = X.utils.json_to_sheet(timelineRows(plan));
  s2['!cols'] = [{ wch: 26 }, { wch: 24 }, { wch: 16 }, { wch: 16 }, { wch: 14 }, { wch: 9 }, { wch: 10 }, { wch: 30 }];
  X.utils.book_append_sheet(wb, s2, 'Timeline');
  const s3 = X.utils.json_to_sheet(Object.values(plan.recipes).map((r) => ({
    Name: r.name, Category: r.category, 'Prep (min)': r.prepTime, 'Chill/Rise (min)': r.waitTime, 'Active (min)': r.activeTime,
    'Passive (min)': r.passiveTime, Where: r.passiveWhere, 'Oven °F': r.ovenTemp || '', Batches: r.batches, 'Rest (min)': r.restTime,
    Equipment: r.equipment.join(', '), Concurrent: r.concurrent ? 'Yes' : 'No', Notes: r.notes,
  })));
  X.utils.book_append_sheet(wb, s3, 'Recipes');
  X.writeFile(wb, `kitchen-sync-${slug(new Date(plan.base).toDateString())}.xlsx`);
}
function exportPNG(plan) {
  const base = new Date(plan.base);
  const serveDay = atMin(base, plan.serveAt);
  const W = 1600, labelW = 230, padR = 40, top = 130, laneH = 26, rowGap = 10;
  const rowsH = plan.rows.map((r) => r.lanes * laneH + rowGap);
  const H = top + rowsH.reduce((a, b) => a + b, 0) + 130;
  const c = document.createElement('canvas');
  c.width = W * 2; c.height = H * 2;
  const g = c.getContext('2d');
  g.scale(2, 2);
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, W, H);
  const font = (w, s) => `${w} ${s}px Inter, system-ui, sans-serif`;
  g.fillStyle = '#ea580c'; g.font = font(800, 30); g.fillText('Kitchen Sync', 40, 54);
  g.fillStyle = '#1c1917'; g.font = font(600, 18);
  g.fillText(`${plan.anchorMode === 'target' ? 'Serve at' : 'Ready at'} ${fmtAt(base, plan.serveAt)} · ${serveDay.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' })}`, 260, 52);
  g.fillStyle = '#78716c'; g.font = font(500, 14);
  g.fillText(`Start ${fmtAt(base, plan.t0, serveDay)} · Total ${fmtDur(plan.stats.total)} · Hands-on ${fmtDur(plan.stats.handsOn)} · ${STRATEGIES[plan.strategy].label} mode · ${plan.settings.ovens} oven(s), ${plan.settings.burners} burners`, 40, 84);
  const t0 = floorTo(plan.t0, 30), t1 = ceilTo(plan.t1 + 20, 30);
  const x = (t) => labelW + ((t - t0) / (t1 - t0)) * (W - labelW - padR);
  const tickStep = t1 - t0 > 600 ? 60 : 30;
  g.font = font(500, 11);
  for (let t = t0; t <= t1; t += tickStep) {
    g.strokeStyle = t % 60 === 0 ? '#e7e5e4' : '#f5f5f4'; g.beginPath(); g.moveTo(x(t), top - 14); g.lineTo(x(t), H - 110); g.stroke();
    g.fillStyle = '#a8a29e'; g.fillText(fmtClock(atMin(base, t)), x(t) + 3, top - 18);
  }
  let y = top;
  const rr = (X0, Y0, w, h, r) => { g.beginPath(); if (g.roundRect) g.roundRect(X0, Y0, w, h, r); else g.rect(X0, Y0, w, h); };
  plan.rows.forEach((row, i) => {
    if (i % 2 === 0) { g.fillStyle = '#fafaf9'; g.fillRect(0, y - 3, W, rowsH[i]); }
    g.fillStyle = row.lane ? '#57534e' : '#1c1917'; g.font = font(row.lane ? 600 : 700, 13);
    if (row.color) { g.fillStyle = row.color; rr(40, y + 7, 9, 9, 3); g.fill(); g.fillStyle = '#1c1917'; }
    g.fillText(row.label.length > 24 ? row.label.slice(0, 23) + '…' : row.label, 56, y + 16);
    row.items.forEach((it) => {
      const X0 = x(it.start), w = Math.max(3, x(it.end) - X0), Y0 = y + it.lane * laneH;
      g.fillStyle = PHASES[it.kind].hex; rr(X0, Y0 + 2, w, laneH - 6, 5); g.fill();
      if (w > 34) {
        g.save(); g.beginPath(); g.rect(X0, Y0, w - 3, laneH); g.clip();
        g.fillStyle = ['bake', 'serve'].includes(it.kind) ? '#ffffff' : '#1c1917'; g.font = font(600, 11);
        g.fillText(it.label, X0 + 5, Y0 + 17); g.restore();
      }
    });
    y += rowsH[i];
  });
  g.strokeStyle = '#059669'; g.lineWidth = 2; g.setLineDash([5, 4]);
  g.beginPath(); g.moveTo(x(plan.serveAt), top - 10); g.lineTo(x(plan.serveAt), y); g.stroke(); g.setLineDash([]);
  let lx = 40; const ly = H - 70; g.font = font(500, 12);
  Object.entries(PHASES).forEach(([k, p]) => {
    g.fillStyle = p.hex; rr(lx, ly, 14, 14, 3); g.fill();
    g.fillStyle = '#44403c'; g.fillText(p.label, lx + 20, ly + 11);
    lx += g.measureText(p.label).width + 44;
  });
  g.fillStyle = '#a8a29e'; g.font = font(400, 11); g.fillText('Generated with Kitchen Sync', 40, H - 28);
  c.toBlob((b) => download(`kitchen-sync-plan-${slug(serveDay.toDateString())}.png`, b), 'image/png');
}

function Stepper({ label, icon, value, onChange, min = 0, max = 10, hint }) {

function Modal({ title, icon, onClose, children, footer, wide }) {

    <div className="fixed inset-0 z-50 flex items-end justify-center bg-stone-900/50 p-0 sm:items-center sm:p-4 print:hidden" onMouseDown={(e) => e.target === e.currentTarget && onClose?.()}>

function RecipeBar({ r, className = 'h-2.5' }) {
  const segs = [['prep', r.prepTime], ['wait', r.waitTime], ['active', r.activeTime],
    [r.passiveWhere === 'oven' ? 'bake' : r.passiveWhere === 'stovetop' ? 'simmer' : 'hold', r.passiveTime * (r.passiveWhere === 'counter' ? 1 : r.batches)], ['rest', r.restTime]].filter(([, v]) => v > 0);

function KitchenStep({ settings, setSettings, recipes }) {
  const set = (k) => (v) => setSettings((s) => ({ ...s, [k]: v }));
  const equip = useMemo(() => {
    const m = {};
    recipes.forEach((r) => r.equipment.forEach((n) => { const k = n.toLowerCase(); (m[k] ||= { name: n, users: [] }).users.push(r.name || 'Untitled'); }));
    return Object.values(m).sort((a, b) => b.users.length - a.users.length);
  }, [recipes]);
  return (
    <div className="space-y-6">
      <div>
        <h2 className="text-2xl font-bold tracking-tight">What are you working with?</h2>
        <p className="mt-1 text-stone-600">Kitchen Sync never double-books an oven rack, a burner, a pair of hands or a piece of equipment.</p>
      </div>
      <div className="grid gap-4 sm:grid-cols-2 lg:grid-cols-4">
        <Stepper label="Ovens" icon="Flame" value={settings.ovens} onChange={set('ovens')} min={0} max={4} hint="Countertop & toaster ovens count." />
        <Stepper label="Racks per oven" icon="Layers" value={settings.racks} onChange={set('racks')} min={1} max={4} hint="Dishes at the same temp can share." />
        <Stepper label="Stovetop burners" icon="CookingPot" value={settings.burners} onChange={set('burners')} min={0} max={8} hint="Include induction hobs or hot plates." />
        <Stepper label="Cooks in the kitchen" icon="Users" value={settings.cooks} onChange={set('cooks')} min={1} max={4} hint="Hands-on tasks run in parallel per cook." />
      </div>
      <Card className="p-5">
        <div className="flex flex-wrap items-center justify-between gap-2">
          <h3 className="flex items-center gap-2 font-semibold"><Icon name="Package" className="h-4 w-4 text-orange-600" />Equipment inventory</h3>
          <span className="text-xs text-stone-500">Built from your recipes · set how many you own</span>
        </div>
        {equip.length === 0 ? (
          <p className="mt-3 rounded-xl bg-stone-50 p-4 text-sm text-stone-500">Add recipes in the next step – their equipment (stand mixer, stockpot, sheet pans…) will show up here.</p>
        ) : (
          <div className="mt-3 divide-y divide-stone-100">
            {equip.map((e) => {
              const g = equipGroup(e.name);
              const count = eqCount(settings, e.name);
              const tight = g !== 'tool' && e.users.length > count;
              return (
                <div key={e.name} className="flex flex-wrap items-center gap-3 py-2.5">
                  <div className="min-w-0 flex-1">
                    <div className="font-medium">{e.name} <span className="ml-1 rounded-full bg-stone-100 px-2 py-0.5 text-xs font-medium text-stone-500">{EQUIP_GROUP_LABEL[g]}</span></div>
                    <div className="truncate text-xs text-stone-500">Used by {e.users.join(', ')}</div>
                  </div>
                  {g === 'tool' ? <span className="text-xs text-stone-400">no conflicts tracked</span> : (
                    <div className="flex items-center gap-2">
                      {tight && <span className="text-xs font-medium text-amber-700">shared – will be scheduled around</span>}
                      <input type="number" min={1} max={12} value={count} className={inputCls + ' w-20 text-center'}
                        onChange={(ev) => setSettings((s) => ({ ...s, equipment: { ...s.equipment, [e.name.toLowerCase()]: clamp(int0(ev.target.value) || 1, 1, 12) } }))} aria-label={`How many ${e.name}`} />
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        )}
      </Card>

              : <> It needs an Anthropic API key (create one at <a className="font-semibold text-violet-700 underline" href="https://console.anthropic.com/settings/keys" target="_blank" rel="noreferrer">console.anthropic.com</a>). Each recipe usually costs a few cents.</>}
          </p>
          {ai.key ? (
            <div className="flex flex-wrap items-center gap-2">
              <code className="rounded bg-white px-2 py-1 text-stone-700">{ai.key.slice(0, 10)}…{ai.key.slice(-4)}</code>
              <button className={btn.ghost + ' !text-xs hover:!text-red-600'} onClick={() => setAi({ key: '', enabled: hosted.enabled })}><Icon name="Trash2" className="h-3.5 w-3.5" />Remove key</button>
            </div>
          ) : (
            <div className="flex gap-2">
              <input type="password" autoComplete="off" className={inputCls} placeholder="sk-ant-…" value={draft} onChange={(e) => setDraft(e.target.value.trim())} />
              <button className={btn.primary + ' !py-1.5'} disabled={!draft} onClick={() => { setAi({ key: draft, enabled: true }); setDraft(''); setOpen(false); }}>Save</button>
            </div>
          )}
          <p className="text-stone-500">The key is saved only in this browser and is sent only to Anthropic, together with the files you import. Anyone using this browser profile could find it, so remove it on shared computers.</p>

  );
}

function ImportPanel({ onImport, busy, progress, ai, setAi, hosted }) {
  const [drag, setDrag] = useState(false);
  const [paste, setPaste] = useState('');
  const [showPaste, setShowPaste] = useState(false);
  const fileRef = useRef();
  return (
    <Card className="p-5">
      <h3 className="flex items-center gap-2 font-semibold"><Icon name="Upload" className="h-4 w-4 text-orange-600" />Import recipes</h3>
      <p className="mt-1 text-sm text-stone-500">Photos or scans, PDFs, text/Markdown, saved recipe web pages (.html) or JSON.</p>
      <AISettings ai={ai} setAi={setAi} hosted={hosted} />
      <div
        className={`mt-4 flex cursor-pointer flex-col items-center justify-center rounded-2xl border-2 border-dashed px-4 py-8 text-center transition ${drag ? 'border-orange-500 bg-orange-50' : 'border-stone-300 hover:border-orange-400 hover:bg-orange-50/40'}`}
        onClick={() => !busy && fileRef.current?.click()}
        onDragOver={(e) => { e.preventDefault(); setDrag(true); }}
        onDragLeave={() => setDrag(false)}
        onDrop={(e) => { e.preventDefault(); setDrag(false); if (!busy && e.dataTransfer.files.length) onImport([...e.dataTransfer.files]); }}
        role="button" tabIndex={0} onKeyDown={(e) => e.key === 'Enter' && fileRef.current?.click()}
      >
        {busy ? <Icon name="Loader2" className="h-8 w-8 animate-spin text-orange-600" /> : <Icon name="FileText" className="h-8 w-8 text-stone-400" />}
        <div className="mt-2 font-semibold text-stone-700">{busy ? progress || 'Reading…' : 'Drop recipe files here or click to browse'}</div>
        <div className="mt-1 text-xs text-stone-500">.jpg .png .pdf .txt .md .html .json – multiple files OK</div>
        <input ref={fileRef} type="file" multiple className="hidden" accept="image/*,.pdf,.txt,.md,.markdown,.json,.html,.htm,.csv"
          onChange={(e) => { if (e.target.files.length) onImport([...e.target.files]); e.target.value = ''; }} />
      </div>
      <button className={btn.ghost + ' mt-3'} onClick={() => setShowPaste((v) => !v)}><Icon name="ClipboardPaste" />{showPaste ? 'Hide' : 'Or paste recipe text'}</button>
      {showPaste && (
        <div className="mt-2 space-y-2">
          <textarea className={inputCls + ' h-40 font-mono text-xs'} value={paste} onChange={(e) => setPaste(e.target.value)}
            placeholder={'Classic Apple Pie\nPrep time: 30 minutes\nCook time: 1 hour\n\nIngredients\n...\n\nInstructions\nPreheat oven to 425°F...\n\n(Separate multiple recipes with a line of ---)'} />
          <button className={btn.primary} disabled={!paste.trim() || busy} onClick={() => { onImport(null, paste); setPaste(''); setShowPaste(false); }}><Icon name="Wand2" />Read recipe</button>
        </div>
      )}
    </Card>
  );
}

function SampleSets({ onLoad }) {
  return (
    <Card className="p-5">
      <h3 className="flex items-center gap-2 font-semibold"><Icon name="Sparkles" className="h-4 w-4 text-orange-600" />Try a sample menu</h3>
      <div className="mt-3 space-y-2">
        {SAMPLE_SETS.map((s) => (
          <div key={s.id} className="flex items-center gap-3 rounded-xl border border-stone-200 p-3 hover:border-orange-300">

            <div className="min-w-0 flex-1">
              <div className="text-sm font-semibold">{s.name}</div>
              <div className="text-xs text-stone-500">{s.blurb}</div>
            </div>
            <div className="flex shrink-0 flex-col gap-1 sm:flex-row">
              <button className={btn.secondary + ' !px-2.5 !py-1.5 !text-xs'} onClick={() => onLoad(s, 'replace')}>Load</button>
              <button className={btn.ghost + ' !text-xs'} onClick={() => onLoad(s, 'add')} title="Add to current recipes">+ Add</button>
            </div>
          </div>
        ))}
      </div>
    </Card>

}

function RecipeCard({ r, color, onEdit, onDup, onDelete }) {
  const chips = [];
  if (r.prepTime) chips.push(['Clock', `Prep ${fmtDur(r.prepTime)}`]);
  if (r.waitTime) chips.push(['Snowflake', `${r.waitLabel || 'Chill'} ${fmtDur(r.waitTime)}`]);
  if (r.activeTime) chips.push(['Hand', `Active ${fmtDur(r.activeTime)}`]);
  if (r.passiveTime) chips.push([r.passiveWhere === 'oven' ? 'Flame' : r.passiveWhere === 'stovetop' ? 'CookingPot' : 'Timer',
    `${r.passiveWhere === 'oven' ? `${r.ovenTemp}°F · ` : r.passiveWhere === 'stovetop' ? 'Simmer · ' : 'Set · '}${fmtDur(r.passiveTime)}${r.batches > 1 ? ` × ${r.batches}` : ''}`]);
  if (r.restTime) chips.push(['Timer', `Rest ${fmtDur(r.restTime)}`]);
  return (
    <div className="group rounded-2xl border border-stone-200 bg-white p-4 shadow-sm transition hover:shadow-md">
      <div className="flex items-start gap-3">
        <span className="mt-1.5 h-3 w-3 shrink-0 rounded-full" style={{ background: color }} />
        <div className="min-w-0 flex-1">
          <div className="flex flex-wrap items-center gap-2">
            <h4 className="font-semibold">{r.name || <span className="italic text-stone-400">Untitled</span>}</h4>
            <span className="rounded-full bg-stone-100 px-2 py-0.5 text-xs font-medium text-stone-600">{r.category}</span>
            {!r.concurrent && <span className="rounded-full bg-violet-100 px-2 py-0.5 text-xs font-medium text-violet-700">needs oven to itself</span>}
            {r.fullOven && <span className="rounded-full bg-rose-100 px-2 py-0.5 text-xs font-medium text-rose-700">full oven</span>}
            {r._review?.length > 0 && <span className="rounded-full bg-amber-100 px-2 py-0.5 text-xs font-medium text-amber-800">needs review</span>}
          </div>
          <div className="mt-2 flex flex-wrap gap-x-3 gap-y-1 text-xs text-stone-600">
            {chips.map(([ic, t]) => <span key={t} className="inline-flex items-center gap-1"><Icon name={ic} className="h-3.5 w-3.5 text-stone-400" />{t}</span>)}
          </div>
          <RecipeBar r={r} className="mt-3 h-2" />
          {r.equipment.length > 0 && <div className="mt-2 truncate text-xs text-stone-500">🍳 {r.equipment.join(' · ')}</div>}
        </div>
        <div className="flex shrink-0 flex-col gap-0.5 sm:flex-row">
          <button className={btn.ghost} onClick={onEdit} aria-label="Edit"><Icon name="Pencil" /></button>
          <button className={btn.ghost} onClick={onDup} aria-label="Duplicate"><Icon name="Copy" /></button>
          <button className={btn.ghost + ' hover:!text-red-600'} onClick={onDelete} aria-label="Delete"><Icon name="Trash2" /></button>
        </div>
      </div>
    </div>
  );
}

function Field({ label, hint, children, className = '' }) {
  return (
    <label className={`block ${className}`}>
      <span className="text-xs font-semibold uppercase tracking-wide text-stone-500">{label}</span>
      <div className="mt-1">{children}</div>
      {hint && <span className="mt-1 block text-xs text-stone-400">{hint}</span>}
    </label>
  );
}
function MinInput({ value, onChange, suffix = 'min', min = 0, max = 2000 }) {
  return (
    <div className="relative">
      <input type="number" min={min} max={max} className={inputCls + ' pr-12'} value={value} onChange={(e) => onChange(e.target.value === '' ? '' : clamp(int0(e.target.value), min, max))} />
      <span className="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-xs text-stone-400">{suffix}</span>
    </div>

}

function RecipeEditor({ recipe, onSave, onClose }) {
  const [r, setR] = useState(() => ({ ...recipe }));

  const set = (k) => (v) => setR((x) => ({ ...x, [k]: v }));
  const addEq = (n) => { n = n.trim(); if (n && !r.equipment.some((e) => e.toLowerCase() === n.toLowerCase())) setR((x) => ({ ...x, equipment: [...x.equipment, n] })); setEqInput(''); };
  const norm = normalizeRecipe(r);
  return (
    <Modal title={recipe.name ? `Edit “${recipe.name}”` : 'New recipe'} icon="ChefHat" onClose={onClose} wide
      footer={<>
        <button className={btn.secondary} onClick={onClose}>Cancel</button>
        <button className={btn.primary} disabled={!String(r.name).trim()} onClick={() => { const out = normalizeRecipe(r); delete out._review; onSave(out); }}><Icon name="Check" />Save recipe</button>
      </>}>
      <div className="space-y-5">
        <div className="grid gap-3 sm:grid-cols-3">
          <Field label="Name" className="sm:col-span-2"><input className={inputCls} value={r.name} onChange={(e) => set('name')(e.target.value)} placeholder="e.g. Roast Turkey" autoFocus /></Field>
          <Field label="Category">
            <select className={inputCls} value={r.category} onChange={(e) => set('category')(e.target.value)}>{CATEGORIES.map((c) => <option key={c}>{c}</option>)}</select>
          </Field>
        </div>

        <div className="rounded-xl bg-stone-50 p-4">
          <div className="mb-3 flex items-center justify-between"><span className="text-sm font-semibold">Timing</span><RecipeBar r={norm} className="ml-4 h-2.5 max-w-[50%]" /></div>
          <div className="grid gap-3 sm:grid-cols-3">
            <Field label="Prep time" hint="Chopping, mixing, assembling"><MinInput value={r.prepTime} onChange={set('prepTime')} /></Field>
            <Field label="Chill / rise / marinate" hint="Hands-off before cooking"><MinInput value={r.waitTime} onChange={set('waitTime')} /></Field>
            <Field label="Wait label"><input className={inputCls} value={r.waitLabel} onChange={(e) => set('waitLabel')(e.target.value)} disabled={!norm.waitTime} /></Field>
            <Field label="Active cook time" hint="Hands-on: sauté, stir, roll, flip"><MinInput value={r.activeTime} onChange={set('activeTime')} /></Field>
            <Field label="Active step uses">
              <select className={inputCls} value={r.activeOnStove ? 'stove' : 'hands'} onChange={(e) => set('activeOnStove')(e.target.value === 'stove')}>
                <option value="stove">A stovetop burner</option><option value="hands">Just my hands (counter)</option>
              </select>
            </Field>
            <Field label="Rest / cool time" hint="After cooking, before serving"><MinInput value={r.restTime} onChange={set('restTime')} /></Field>
            <Field label="Passive cook / bake time" hint="Unattended: oven, simmer, set"><MinInput value={r.passiveTime} onChange={set('passiveTime')} /></Field>
            <Field label="Passive step happens in">
              <select className={inputCls} value={r.passiveWhere} onChange={(e) => set('passiveWhere')(e.target.value)}>
                <option value="oven">Oven</option><option value="stovetop">Stovetop (simmer)</option><option value="counter">Counter / fridge</option>
              </select>
            </Field>
            <Field label="Batches" hint="e.g. 3 trays of cookies"><MinInput value={r.batches} onChange={set('batches')} suffix="×" min={1} max={12} /></Field>
          </div>
        </div>

        <div className={`grid gap-3 sm:grid-cols-3 ${r.passiveWhere !== 'oven' ? 'opacity-50' : ''}`}>
          <Field label="Oven temperature"><MinInput value={r.ovenTemp} onChange={set('ovenTemp')} suffix="°F" max={600} /></Field>
          <Field label="Oven space">
            <select className={inputCls} value={r.fullOven ? 'full' : 'rack'} onChange={(e) => set('fullOven')(e.target.value === 'full')} disabled={r.passiveWhere !== 'oven'}>
              <option value="rack">One rack</option><option value="full">Whole oven</option>
            </select>
          </Field>
          <Field label="Can cook alongside other dishes?">
            <div className="flex overflow-hidden rounded-lg border border-stone-300">
              {[[true, 'Yes'], [false, 'No']].map(([v, l]) => (
                <button key={l} type="button" onClick={() => set('concurrent')(v)} className={`flex-1 py-2 text-sm font-semibold ${r.concurrent === v ? 'bg-orange-600 text-white' : 'bg-white text-stone-600 hover:bg-stone-50'}`}>{l}</button>
              ))}
            </div>
          </Field>
        </div>

        <Field label="Required equipment">
          <div className="flex flex-wrap gap-1.5">
            {r.equipment.map((e) => (
              <span key={e} className="inline-flex items-center gap-1 rounded-full bg-orange-100 py-1 pl-3 pr-1.5 text-xs font-medium text-orange-800">
                {e}<button type="button" onClick={() => setR((x) => ({ ...x, equipment: x.equipment.filter((y) => y !== e) }))} className="rounded-full p-0.5 hover:bg-orange-200" aria-label={`Remove ${e}`}><Icon name="X" className="h-3 w-3" /></button>
              </span>
            ))}
          </div>
          <div className="mt-2 flex gap-2">
            <input className={inputCls} list="eq-list" value={eqInput} onChange={(e) => setEqInput(e.target.value)} onKeyDown={(e) => { if (e.key === 'Enter') { e.preventDefault(); addEq(eqInput); } }} placeholder="Stand Mixer, Stockpot, Sheet Pan…" />
            <datalist id="eq-list">{KNOWN_EQUIPMENT.map((k) => <option key={k} value={k} />)}</datalist>
            <button type="button" className={btn.secondary} onClick={() => addEq(eqInput)}>Add</button>
          </div>
        </Field>
        <Field label="Prep steps / ingredient notes">
          <textarea className={inputCls + ' h-28'} value={r.notes} onChange={(e) => set('notes')(e.target.value)} placeholder="Shown in your checklist alongside each step." />
        </Field>
      </div>
    </Modal>
  );
}

      <div>
        <h2 className="text-2xl font-bold tracking-tight">What's on the menu?</h2>

      <div className="grid gap-6 lg:grid-cols-5">

            </div>

            <div className="grid place-items-center rounded-2xl border-2 border-dashed border-stone-300 bg-white/60 px-6 py-16 text-center">

              <p className="mt-3 font-semibold text-stone-600">No recipes yet</p>

              ))}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ================================================================
   Step 3 – Schedule settings
   ================================================================ */
function ChoiceCard({ active, onClick, icon, title, children }) {
  return (
    <button type="button" onClick={onClick}
      className={`w-full rounded-2xl border-2 p-4 text-left transition ${active ? 'border-orange-500 bg-orange-50 shadow-sm' : 'border-stone-200 bg-white hover:border-orange-300'}`}>
      <div className="flex items-center gap-3">
        <div className={`grid h-10 w-10 place-items-center rounded-xl ${active ? 'bg-orange-600 text-white' : 'bg-stone-100 text-stone-500'}`}><Icon name={icon} className="h-5 w-5" /></div>
        <div className="font-semibold">{title}</div>
        {active && <Icon name="CheckCircle2" className="ml-auto h-5 w-5 text-orange-600" />}
      </div>
      <div className="mt-2 text-sm text-stone-600">{children}</div>
    </button>
  );
}
function ScheduleStep({ settings, setSettings, recipes, onGenerate }) {
  const set = (k, v) => setSettings((s) => ({ ...s, [k]: v }));
  const norm = recipes.map(normalizeRecipe);
  const preview = useMemo(() => idealOvenConflicts(norm, settings, stratParams(settings), settings.anchor === 'target' ? -1 : 1), [recipes, settings]);
  return (
    <div className="space-y-6">
      <div>
        <h2 className="text-2xl font-bold tracking-tight">Set the clock & the pace</h2>
        <p className="mt-1 text-stone-600">Pick an anchor time and how intense you want the session to be.</p>
      </div>
      <div className="grid gap-6 lg:grid-cols-2">
        <Card className="p-5">
          <h3 className="flex items-center gap-2 font-semibold"><Icon name="CalendarClock" className="h-4 w-4 text-orange-600" />Time anchor</h3>
          <div className="mt-3 grid gap-3 sm:grid-cols-2">
            <ChoiceCard active={settings.anchor === 'target'} onClick={() => set('anchor', 'target')} icon="Target" title="Ready by…">Work backwards so everything lands on the table together.</ChoiceCard>
            <ChoiceCard active={settings.anchor === 'start'} onClick={() => set('anchor', 'start')} icon="Play" title="Start at…">Work forwards from when you walk into the kitchen.</ChoiceCard>
          </div>
          <Field label={settings.anchor === 'target' ? 'I need everything ready by' : 'I want to start cooking at'} className="mt-4">
            <input type="datetime-local" className={inputCls} value={settings.time} onChange={(e) => set('time', e.target.value)} />
          </Field>
        </Card>
        <Card className="p-5">
          <h3 className="flex items-center gap-2 font-semibold"><Icon name="Zap" className="h-4 w-4 text-orange-600" />Optimization strategy</h3>
          <div className="mt-3 grid gap-3 sm:grid-cols-2">
            <ChoiceCard active={settings.strategy === 'express'} onClick={() => set('strategy', 'express')} icon="Zap" title="Express">
              <ul className="list-disc space-y-0.5 pl-4"><li>Shortest total time</li><li>Shares racks; nudges temps ±25°F</li><li>Back-to-back prep</li></ul>
            </ChoiceCard>
            <ChoiceCard active={settings.strategy === 'chill'} onClick={() => set('strategy', 'chill')} icon="Coffee" title="Chill Baking">
              <ul className="list-disc space-y-0.5 pl-4"><li>One dish per oven at a time</li><li>Breathing room between tasks</li><li>Exact recipe temps</li></ul>
            </ChoiceCard>
          </div>
          {settings.strategy === 'chill' && (
            <Field label={`Buffer after each hands-on task: ${settings.buffer} min`} className="mt-4">
              <input type="range" min={0} max={30} step={5} value={settings.buffer} onChange={(e) => set('buffer', +e.target.value)} className="w-full accent-orange-600" />
            </Field>
          )}
        </Card>
      </div>
      <Card className="p-5">
        <h3 className="flex items-center gap-2 font-semibold"><Icon name="Thermometer" className="h-4 w-4 text-orange-600" />Pre-flight oven check</h3>
        {preview.length === 0 ? (
          <p className="mt-2 flex items-center gap-2 text-sm text-emerald-700"><Icon name="CheckCircle2" />No oven temperature clashes detected with {settings.ovens} oven{settings.ovens === 1 ? '' : 's'}.</p>
        ) : (
          <ul className="mt-2 space-y-1.5 text-sm">
            {preview.map((c) => (
              <li key={c.key} className="flex items-start gap-2 text-amber-800"><Icon name="AlertTriangle" className="mt-0.5 h-4 w-4 shrink-0" />
                <span><b>{c.a.name}</b> ({c.a.ovenTemp}°F) and <b>{c.b.name}</b> ({c.b.ovenTemp}°F) would ideally bake at the same time — {c.diff}°F apart. We'll ask how to handle it.</span></li>
            ))}
          </ul>
        )}
        <div className="mt-5 flex flex-wrap items-center gap-3">
          <button className={btn.primary + ' !px-6 !py-3 !text-base'} disabled={!recipes.length} onClick={onGenerate}><Icon name="Wand2" className="h-5 w-5" />Build my master plan</button>
          {!recipes.length && <span className="text-sm text-stone-500">Add at least one recipe first.</span>}
        </div>
      </Card>
    </div>
  );
}

/* ================================================================
   Step 4 – Plan: alerts, Gantt, checklist, exports
   ================================================================ */
function AlertsPanel({ alerts, onAction }) {
  const [open, setOpen] = useState(true);
  if (!alerts.length) return null;
  const style = {
    error: ['bg-red-50 border-red-200 text-red-900', 'AlertTriangle', 'text-red-600'],
    conflict: ['bg-amber-50 border-amber-200 text-amber-950', 'Thermometer', 'text-amber-600'],
    warning: ['bg-amber-50 border-amber-200 text-amber-950', 'AlertTriangle', 'text-amber-600'],
    info: ['bg-sky-50 border-sky-200 text-sky-950', 'Info', 'text-sky-600'],
  };
  const sorted = [...alerts].sort((a, b) => ['error', 'conflict', 'warning', 'info'].indexOf(a.severity) - ['error', 'conflict', 'warning', 'info'].indexOf(b.severity));
  const serious = alerts.filter((a) => a.severity !== 'info').length;
  return (
    <Card className="p-4 print:hidden">
      <button className="flex w-full items-center justify-between text-left" onClick={() => setOpen((o) => !o)}>
        <span className="flex items-center gap-2 font-semibold"><Icon name="AlertTriangle" className={`h-4 w-4 ${serious ? 'text-amber-600' : 'text-sky-600'}`} />
          Smart conflict check · {serious ? `${serious} item${serious > 1 ? 's' : ''} to look at` : 'all clear'} <span className="font-normal text-stone-500">({alerts.length} notes)</span></span>
        <Icon name={open ? 'ChevronUp' : 'ChevronDown'} className="h-4 w-4 text-stone-500" />
      </button>
      {open && (
        <div className="mt-3 space-y-2">
          {sorted.map((a) => {
            const [cls, ic, icCls] = style[a.severity];
            return (
              <div key={a.id} className={`rounded-xl border p-3 ${cls}`}>
                <div className="flex items-start gap-2">
                  <Icon name={ic} className={`mt-0.5 h-4 w-4 shrink-0 ${icCls}`} />
                  <div className="min-w-0 flex-1">
                    <div className="text-sm font-semibold">{a.title}</div>
                    <div className="mt-0.5 text-sm opacity-90">{a.body}</div>
                    {a.actions?.length > 0 && (
                      <div className="mt-2 flex flex-wrap gap-2">
                        {a.actions.map((x) => (
                          <button key={x.label} className="rounded-lg border border-current/20 bg-white/80 px-2.5 py-1 text-xs font-semibold hover:bg-white" title={x.hint} onClick={() => onAction(x.action)}>
                            {x.label}{x.hint && <span className="ml-1 font-normal opacity-70">· {x.hint}</span>}
                          </button>
                        ))}
                      </div>
                    )}
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      )}
    </Card>
  );
}

function Gantt({ plan }) {
  const base = new Date(plan.base);
  const serveDay = atMin(base, plan.serveAt);
  const wrapRef = useRef();
  const [width, setWidth] = useState(900);
  const [zoom, setZoom] = useState('fit');
  const [now, setNow] = useState(Date.now());
  useEffect(() => {
    const ro = new ResizeObserver(([e]) => setWidth(e.contentRect.width));
    if (wrapRef.current) ro.observe(wrapRef.current);
    const t = setInterval(() => setNow(Date.now()), 30000);
    return () => { ro.disconnect(); clearInterval(t); };
  }, []);
  const labelW = width < 640 ? 110 : 190;
  const t0 = floorTo(plan.t0, 30), t1 = ceilTo(plan.t1 + 20, 30);
  const span = t1 - t0;
  const ppm = zoom === 'fit' ? Math.max(0.35, (width - labelW - 12) / span) : zoom;
  const inner = span * ppm;
  const tickStep = ppm * 60 < 70 ? 120 : ppm * 30 < 60 ? 60 : ppm * 15 < 60 ? 30 : 15;
  const ticks = [];
  for (let t = ceilTo(t0, tickStep); t <= t1; t += tickStep) ticks.push(t);
  const X = (t) => (t - t0) * ppm;
  const nowMin = (now - plan.base) / 60000;
  const laneH = 26;
  return (
    <div>
      <div className="mb-3 flex flex-wrap items-center justify-between gap-2">
        <div className="flex flex-wrap gap-x-3 gap-y-1">
          {Object.entries(PHASES).map(([k, p]) => <span key={k} className="inline-flex items-center gap-1.5 text-xs text-stone-600"><span className={`h-3 w-3 rounded ${p.cls}`} />{p.label}</span>)}
        </div>
        <div className="flex overflow-hidden rounded-lg border border-stone-300 text-xs font-semibold">
          {[['fit', 'Fit'], [2, 'Zoom'], [4, 'Detail']].map(([z, l]) => (
            <button key={l} className={`px-3 py-1.5 ${zoom === z ? 'bg-stone-800 text-white' : 'bg-white text-stone-600 hover:bg-stone-50'}`} onClick={() => setZoom(z)}>{l}</button>
          ))}
        </div>
      </div>
      <div ref={wrapRef} className="overflow-x-auto rounded-xl border border-stone-200 scroll-thin">
        <div style={{ width: labelW + inner }} className="relative">
          <div className="sticky top-0 z-20 flex border-b border-stone-200 bg-white">
            <div className="sticky left-0 z-10 shrink-0 bg-white" style={{ width: labelW }} />
            <div className="relative h-8" style={{ width: inner }}>
              {ticks.map((t) => <span key={t} className="absolute top-2 -translate-x-1/2 whitespace-nowrap text-[11px] font-medium text-stone-500" style={{ left: Math.max(X(t), 28) }}>{fmtClock(atMin(base, t))}</span>)}
            </div>
          </div>
          {plan.rows.map((row, i) => (
            <div key={row.key} className={`flex border-b border-stone-100 ${row.lane ? 'bg-stone-50/70' : i % 2 ? 'bg-stone-50/30' : ''}`}>
              <div className="sticky left-0 z-10 flex shrink-0 items-center gap-2 border-r border-stone-200 bg-inherit px-3 py-1.5 backdrop-blur" style={{ width: labelW, background: row.lane ? '#fafaf9' : '#fff' }}>
                {row.color ? <span className="h-2.5 w-2.5 shrink-0 rounded-full" style={{ background: row.color }} /> : <Icon name={row.key === 'serve' ? 'Utensils' : 'Flame'} className="h-3.5 w-3.5 shrink-0 text-stone-400" />}
                <div className="min-w-0"><div className="truncate text-xs font-semibold sm:text-sm">{row.label}</div><div className="truncate text-[10px] text-stone-400 sm:text-xs">{row.sub}</div></div>
              </div>
              <div className="relative" style={{ width: inner, height: row.lanes * laneH + 10 }}>
                {ticks.map((t) => <div key={t} className="absolute inset-y-0 w-px bg-stone-100" style={{ left: X(t) }} />)}
                {row.items.map((it, j) => {
                  const w = Math.max(3, (it.end - it.start) * ppm);
                  return (
                    <div key={j} title={it.tip}
                      className={`absolute flex items-center overflow-hidden whitespace-nowrap rounded-md px-1.5 text-[11px] font-semibold shadow-sm ${PHASES[it.kind].cls} ${it.adjusted ? 'ring-2 ring-amber-300 ring-offset-1' : ''}`}
                      style={{ left: X(it.start), width: w, top: 5 + it.lane * laneH, height: laneH - 5 }}>
                      {w > 30 && it.label}
                    </div>
                  );
                })}
              </div>
            </div>
          ))}
          <div className="pointer-events-none absolute bottom-0 top-8 w-0.5 bg-emerald-600/70" style={{ left: labelW + X(plan.serveAt) }} />
          {nowMin > t0 && nowMin < t1 && (
            <div className="pointer-events-none absolute bottom-0 top-0 z-30 w-0.5 bg-red-500" style={{ left: labelW + X(nowMin) }}>
              <span className="absolute -left-4 top-0 rounded bg-red-500 px-1 text-[10px] font-bold text-white">NOW</span>
            </div>
          )}
        </div>
      </div>
      <p className="mt-2 text-xs text-stone-500">Hover a bar for exact times. Amber-outlined bakes were nudged to share an oven. Green line = {plan.anchorMode === 'target' ? 'serving time' : 'finish'} ({fmtAt(base, plan.serveAt, serveDay)}).</p>
    </div>
  );
}

function Checklist({ plan, checked, setChecked }) {
  const base = new Date(plan.base);
  const serveDay = atMin(base, plan.serveAt);
  const [filter, setFilter] = useState('all');
  const [hideDone, setHideDone] = useState(false);
  const done = plan.events.filter((e) => checked[e.id]).length;
  const nextId = plan.events.find((e) => !checked[e.id])?.id;
  const visible = plan.events.filter((e) => (filter === 'all' || e.recipeId === filter || (filter === 'oven' && e.kind === 'oven')) && !(hideDone && checked[e.id]));
  const pct = Math.round((done / Math.max(1, plan.events.length)) * 100);
  return (
    <div>
      <div className="mb-3 flex flex-wrap items-center gap-3">
        <div className="min-w-[200px] flex-1">
          <div className="flex justify-between text-xs font-medium text-stone-500"><span>{done} of {plan.events.length} steps done</span><span>{pct}%</span></div>
          <div className="mt-1 h-2 overflow-hidden rounded-full bg-stone-100"><div className="h-full rounded-full bg-emerald-500 transition-all" style={{ width: `${pct}%` }} /></div>
        </div>
        <select className={inputCls + ' !w-auto'} value={filter} onChange={(e) => setFilter(e.target.value)} aria-label="Filter steps">
          <option value="all">All steps</option><option value="oven">Oven only</option>
          {plan.order.map((id) => <option key={id} value={id}>{plan.recipes[id].name}</option>)}
        </select>
        <label className="flex items-center gap-2 text-sm text-stone-600"><input type="checkbox" checked={hideDone} onChange={(e) => setHideDone(e.target.checked)} className="accent-orange-600" />Hide done</label>
        <button className={btn.ghost} onClick={() => setChecked({})}><Icon name="RotateCcw" />Reset</button>
      </div>
      <ol className="divide-y divide-stone-100 rounded-xl border border-stone-200">
        {visible.map((e) => {
          const isDone = !!checked[e.id];
          const isNext = e.id === nextId;
          const big = e.kind === 'serve';
          return (
            <li key={e.id}>
              <label className={`flex cursor-pointer items-start gap-3 px-3 py-2.5 transition hover:bg-orange-50/50 ${isNext ? 'bg-orange-50 ring-1 ring-inset ring-orange-300' : ''} ${big ? 'bg-emerald-50' : ''}`}>
                <span className="w-24 shrink-0 pt-0.5 text-right text-sm font-semibold tabular text-stone-500 sm:w-28">{fmtAt(base, e.t, serveDay)}</span>
                <input type="checkbox" className="mt-1 h-4 w-4 shrink-0 accent-emerald-600" checked={isDone} onChange={() => setChecked((c) => ({ ...c, [e.id]: !c[e.id] }))} />
                <span className="mt-1.5 h-2.5 w-2.5 shrink-0 rounded-full" style={{ background: EVENT_DOT[e.kind] }} />
                <span className={`min-w-0 flex-1 ${isDone ? 'text-stone-400 line-through' : ''}`}>
                  <span className={`block text-sm ${big ? 'text-base font-bold text-emerald-800' : 'font-semibold'}`}>{e.text}{isNext && !isDone && <span className="ml-2 rounded bg-orange-600 px-1.5 py-0.5 text-[10px] font-bold uppercase text-white no-underline">next</span>}</span>
                  {e.detail && <span className="block text-xs text-stone-500">{e.detail}</span>}
                </span>
              </label>
            </li>
          );
        })}
        {!visible.length && <li className="p-6 text-center text-sm text-stone-500">Nothing to show with these filters.</li>}
      </ol>
    </div>
  );
}

function PlanStep({ plan, stale, onRebuild, checked, setChecked, onAction, toast }) {
  const [tab, setTab] = useState('timeline');
  const [busy, setBusy] = useState('');
  if (!plan) return null;
  const base = new Date(plan.base);
  const serveDay = atMin(base, plan.serveAt);
  const stats = [
    ['Play', 'Start', fmtAt(base, plan.t0, serveDay)],
    [plan.anchorMode === 'target' ? 'Target' : 'Flag', plan.anchorMode === 'target' ? 'Serve' : 'Finish', fmtAt(base, plan.serveAt, serveDay)],
    ['Clock', 'Total time', fmtDur(plan.stats.total)],
    ['Hand', 'Hands-on', fmtDur(plan.stats.handsOn)],
    ['Flame', 'Oven time', fmtDur(plan.stats.ovenMin)],
    ['ListChecks', 'Steps', plan.stats.steps],
  ];
  const run = async (key, fn) => { setBusy(key); try { await fn(); } catch (e) { toast(e.message || 'Export failed', 'error'); } setBusy(''); };
  return (
    <div className="space-y-5">
      <div className="flex flex-wrap items-end justify-between gap-3">
        <div>
          <h2 className="text-2xl font-bold tracking-tight">Your master plan</h2>
          <p className="mt-1 text-stone-600">{serveDay.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' })} · {STRATEGIES[plan.strategy].label} mode · {plan.settings.ovens} oven{plan.settings.ovens === 1 ? '' : 's'}, {plan.settings.burners} burners, {plan.settings.cooks} cook{plan.settings.cooks === 1 ? '' : 's'}</p>
        </div>
        <div className="flex flex-wrap gap-2 print:hidden">
          <button className={btn.secondary} onClick={() => exportCSV(plan, checked)}><Icon name="FileText" />CSV</button>
          <button className={btn.secondary} disabled={busy === 'x'} onClick={() => run('x', () => exportXLSX(plan, checked))}><Icon name={busy === 'x' ? 'Loader2' : 'FileSpreadsheet'} className={`h-4 w-4 ${busy === 'x' ? 'animate-spin' : ''}`} />Excel</button>
          <button className={btn.secondary} onClick={() => exportPNG(plan)}><Icon name="ImageDown" />Graphic</button>
          <button className={btn.secondary} onClick={() => window.print()}><Icon name="Printer" />Print / PDF</button>
        </div>
      </div>
      {stale && (
        <div className="flex flex-wrap items-center justify-between gap-3 rounded-xl border border-orange-200 bg-orange-50 px-4 py-3 print:hidden">
          <span className="flex items-center gap-2 text-sm font-medium text-orange-900"><Icon name="Info" />Recipes or settings changed since this plan was built.</span>
          <button className={btn.primary + ' !py-1.5'} onClick={onRebuild}><Icon name="RotateCcw" />Rebuild plan</button>
        </div>
      )}
      <div className="grid grid-cols-2 gap-3 sm:grid-cols-3 lg:grid-cols-6">
        {stats.map(([ic, l, v]) => (
          <Card key={l} className="p-3">
            <div className="flex items-center gap-1.5 text-xs font-medium text-stone-500"><Icon name={ic} className="h-3.5 w-3.5" />{l}</div>
            <div className="mt-1 text-lg font-bold tabular">{v}</div>
          </Card>
        ))}
      </div>
      <AlertsPanel alerts={plan.alerts} onAction={onAction} />
      <Card className="p-4">
        <div className="mb-4 flex gap-1 rounded-xl bg-stone-100 p-1 sm:w-fit">
          {[['timeline', 'GanttChart', 'Timeline'], ['checklist', 'ListChecks', 'Checklist']].map(([k, ic, l]) => (
            <button key={k} onClick={() => setTab(k)} className={`flex flex-1 items-center justify-center gap-2 rounded-lg px-4 py-2 text-sm font-semibold transition sm:flex-none ${tab === k ? 'bg-white text-stone-900 shadow-sm' : 'text-stone-500 hover:text-stone-800'}`}>
              <Icon name={ic} />{l}
            </button>
          ))}
        </div>
        {tab === 'timeline' ? <Gantt plan={plan} /> : <Checklist plan={plan} checked={checked} setChecked={setChecked} />}
      </Card>
    </div>
  );
}

function ClarifyModal({ data, onApply, onClose }) {
  const [vals, setVals] = useState(() => Object.fromEntries(data.questions.map((q) => [q.key, q.value])));
  const groups = [
    ['error', 'Needed to build your plan', 'AlertTriangle', 'text-red-600'],
    ['conflict', 'Oven conflicts', 'Thermometer', 'text-amber-600'],
    ['review', "Couldn't find these in your files", 'HelpCircle', 'text-sky-600'],
    ['warning', 'Worth double-checking', 'Info', 'text-amber-600'],
  ];
  const missing = data.questions.filter((q) => q.severity === 'error' && (vals[q.key] === '' || vals[q.key] == null));
  return (
    <Modal title={data.mode === 'import' ? 'A few quick questions about your recipes' : 'Before we build your plan…'} icon="HelpCircle" onClose={onClose}
      footer={<>
        <button className={btn.secondary} onClick={onClose}>{data.mode === 'import' ? 'Skip for now' : 'Go back'}</button>
        <button className={btn.primary} disabled={missing.length > 0} onClick={() => onApply(vals)}><Icon name="Check" />{data.mode === 'import' ? 'Save answers' : 'Apply & build plan'}</button>
      </>}>
      <div className="space-y-5">
        {groups.map(([sev, title, ic, icCls]) => {
          const qs = data.questions.filter((q) => q.severity === sev);
          if (!qs.length) return null;
          return (
            <div key={sev}>
              <div className="mb-2 flex items-center gap-2 text-xs font-bold uppercase tracking-wide text-stone-500"><Icon name={ic} className={`h-4 w-4 ${icCls}`} />{title}</div>
              <div className="space-y-3">
                {qs.map((q) => (
                  <div key={q.key} className="rounded-xl border border-stone-200 p-3">
                    <div className="text-sm font-medium">{q.q}</div>
                    <div className="mt-2">
                      {q.input === 'number' && (
                        <div className="relative w-40"><input type="number" className={inputCls + ' pr-10'} value={vals[q.key]} onChange={(e) => setVals((v) => ({ ...v, [q.key]: e.target.value }))} />
                          {q.unit && <span className="absolute right-3 top-1/2 -translate-y-1/2 text-xs text-stone-400">{q.unit}</span>}</div>
                      )}
                      {q.input === 'text' && <input className={inputCls} value={vals[q.key]} onChange={(e) => setVals((v) => ({ ...v, [q.key]: e.target.value }))} />}
                      {q.input === 'datetime' && <input type="datetime-local" className={inputCls + ' sm:w-64'} value={vals[q.key]} onChange={(e) => setVals((v) => ({ ...v, [q.key]: e.target.value }))} />}
                      {q.input === 'select' && (
                        <select className={inputCls + ' sm:w-56'} value={vals[q.key]} onChange={(e) => setVals((v) => ({ ...v, [q.key]: e.target.value }))}>{q.options.map((o) => <option key={o}>{o}</option>)}</select>
                      )}
                      {q.input === 'choice' && (
                        <div className="space-y-1.5">
                          {q.options.map((o) => (
                            <label key={o.value} className={`flex cursor-pointer items-center gap-2 rounded-lg border px-3 py-2 text-sm ${vals[q.key] === o.value ? 'border-orange-400 bg-orange-50' : 'border-stone-200 hover:bg-stone-50'}`}>
                              <input type="radio" name={q.key} className="accent-orange-600" checked={vals[q.key] === o.value} onChange={() => setVals((v) => ({ ...v, [q.key]: o.value }))} />{o.label}
                            </label>
                          ))}
                        </div>
                      )}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          );
        })}
      </div>
    </Modal>
  );
}
